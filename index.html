<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心花绽放 · 美好时光</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "楷体", KaiTi, serif;
            background: linear-gradient(45deg, #ff6b6b, #ffc0cb, #ff9a9e);
            background-size: 400% 400%;
            animation: gradientShift 8s ease infinite;
            min-height: 100vh;
            overflow-x: hidden;
            /* 禁止右键菜单和选择 */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .main-container {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            position: relative;
            z-index: 2;
        }

        /* 头部标题区域 */
        .header {
            text-align: center;
            padding: 40px 20px;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .main-title {
            font-size: 3rem;
            margin-bottom: 10px;
            opacity: 0;
            animation: titleFadeIn 2s ease-in-out 0.5s forwards;
        }

        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
            opacity: 0;
            animation: titleFadeIn 2s ease-in-out 1s forwards;
        }

        @keyframes titleFadeIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 内容区域 */
        .content {
            flex: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            gap: 40px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        /* 图片轮播区域 */
        .carousel-container {
            flex: 1;
            max-width: 500px;
            position: relative;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            opacity: 0;
            animation: slideInLeft 1.5s ease-in-out 1.5s forwards;
        }

        .carousel {
            position: relative;
            width: 100%;
            height: 400px;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .carousel-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        .carousel-slide.active {
            opacity: 1;
        }

        .carousel-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 15px;
            /* 禁止图片下载保护 */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-user-drag: none;
            -khtml-user-drag: none;
            -moz-user-drag: none;
            -o-user-drag: none;
            user-drag: none;
            pointer-events: none;
        }

        /* 图片保护层 */
        .image-protection {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            z-index: 10;
            cursor: default;
            border-radius: 15px;
        }

        /* 导航点 */
        .carousel-dots {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .dot.active {
            background: white;
            transform: scale(1.2);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }

        .dot:hover {
            background: rgba(255, 255, 255, 0.8);
            transform: scale(1.1);
        }

        /* 心形动画区域 */
        .heart-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            opacity: 0;
            animation: slideInRight 1.5s ease-in-out 2s forwards;
        }

        .center-heart {
            background-color: #ff3366;
            display: inline-block;
            height: 120px;
            position: relative;
            transform: rotate(-45deg);
            width: 120px;
            animation: appear 3s ease-in-out 2.5s forwards, beat 1.5s ease-in-out infinite 5.5s;
            opacity: 0;
            filter: drop-shadow(0 0 20px rgba(255, 51, 102, 0.6));
        }

        .center-heart:before,
        .center-heart:after {
            content: "";
            background-color: #ff3366;
            border-radius: 50%;
            height: 120px;
            position: absolute;
            width: 120px;
        }

        .center-heart:before {
            top: -60px;
            left: 0;
        }

        .center-heart:after {
            left: 60px;
            top: 0;
        }

        .romantic-text {
            color: white;
            font-size: 1.8rem;
            text-align: center;
            line-height: 2;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            max-width: 300px;
        }

        .romantic-text .line {
            display: block;
            opacity: 0;
        }

        /* 飘浮的心形 */
        .floating-heart {
            background-color: rgba(255, 255, 255, 0.9);
            display: inline-block;
            height: 20px;
            position: absolute;
            transform: rotate(-45deg);
            width: 20px;
            box-shadow: 0 0 15px rgba(255, 192, 203, 0.8);
            animation: float 6s ease-in-out infinite;
            z-index: 1;
        }

        .floating-heart:before,
        .floating-heart:after {
            content: "";
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            height: 20px;
            position: absolute;
            width: 20px;
            box-shadow: 0 0 15px rgba(255, 192, 203, 0.8);
        }

        .floating-heart:before {
            top: -10px;
            left: 0;
        }

        .floating-heart:after {
            left: 10px;
            top: 0;
        }

        /* 动画定义 */
        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-100px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(100px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes appear {
            0% {
                transform: rotate(-45deg) scale(0.1);
                opacity: 0;
            }
            50% {
                transform: rotate(-45deg) scale(1.2);
                opacity: 0.7;
            }
            100% {
                transform: rotate(-45deg) scale(1);
                opacity: 1;
            }
        }

        @keyframes beat {
            0%, 100% {
                transform: rotate(-45deg) scale(1);
            }
            50% {
                transform: rotate(-45deg) scale(1.15);
            }
        }

        @keyframes float {
            0% {
                transform: translateY(0) rotate(-45deg) scale(1);
                opacity: 0.8;
            }
            100% {
                transform: translateY(-100vh) rotate(315deg) scale(0.3);
                opacity: 0;
            }
        }

        @keyframes textFadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .content {
                flex-direction: column;
                gap: 30px;
                padding: 20px 10px;
            }

            .carousel-container {
                max-width: 100%;
                width: 100%;
            }

            .carousel {
                height: 300px;
            }

            .main-title {
                font-size: 2rem;
            }

            .romantic-text {
                font-size: 1.4rem;
            }

            .center-heart {
                height: 80px;
                width: 80px;
            }

            .center-heart:before,
            .center-heart:after {
                height: 80px;
                width: 80px;
            }

            .center-heart:before {
                top: -40px;
            }

            .center-heart:after {
                left: 40px;
            }
        }

        @media (max-width: 480px) {
            .header {
                padding: 20px 10px;
            }

            .main-title {
                font-size: 1.5rem;
            }

            .subtitle {
                font-size: 1rem;
            }

            .carousel {
                height: 250px;
            }

            .romantic-text {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- 头部标题 -->
        <header class="header">
            <!-- <h1 class="main-title">心花绽放</h1> -->
            <h1>记录美好时光，珍藏温馨回忆</h1>
        </header>

        <!-- 主要内容区域 -->
        <main class="content">
            <!-- 图片轮播区域 -->
            <div class="carousel-container">
                <div class="carousel" id="carousel">
                    <!-- 图片将通过 JavaScript 动态生成 -->
                </div>
                
                <!-- 导航点 -->
                <div class="carousel-dots" id="carouselDots">
                    <!-- 导航点将通过 JavaScript 动态生成 -->
                </div>
            </div>

            <!-- 心形动画区域 -->
            <div class="heart-section">
                <div class="center-heart"></div>
                <div class="romantic-text" id="romanticText">
                    <!-- <span class="line">时光荏苒如流水</span>
                    <span class="line">唯有真情永不变</span>
                    <span class="line">愿此心如花绽放</span>
                    <span class="line">伴君共度好时光</span> -->
                </div>
            </div>
        </main>
    </div>

    <script>
        // 图片资源保护和混淆
        const IMAGE_KEYS = ['a1b2c3', 'd4e5f6', 'g7h8i9', 'j0k1l2', 'm3n4o5'];
        const IMAGE_MAP = new Map();
        
        // 动态生成图片路径（混淆处理）
        function initImageMap() {
            const baseNames = [
                '929CC4CE-A747-4565-8349-083257897893_1_105_c.jpeg',
                'AE24F6C5-D044-45CF-83AC-290BD85E2775.webp',
                'CBC1BA9F-0C65-489A-9FBA-9A3F95CE1953.webp',
                'DC7A179F-3241-44C7-8B5F-576D329FEE85_1_105_c.jpeg',
                'EF9C962F-7A5A-4A20-A1DE-36239DF1FB39_1_105_c.jpeg'
            ];
            
            baseNames.forEach((name, index) => {
                IMAGE_MAP.set(IMAGE_KEYS[index], name);
            });
        }
        
        // 获取混淆后的图片列表
        const ALL_IMAGES = IMAGE_KEYS;

        // 获取当前显示的图片列表（自动适应图片数量）
        function getCurrentImageList(startIndex = 0) {
            const maxDisplayImages = 6;
            const totalImages = ALL_IMAGES.length;
            
            // 如果图片总数不超过最大显示数量，直接返回所有图片
            if (totalImages <= maxDisplayImages) {
                return ALL_IMAGES;
            }
            
            // 如果图片数量超过最大显示数量，返回轮播的6张图片
            const imageList = [];
            for (let i = 0; i < maxDisplayImages; i++) {
                const index = (startIndex + i) % totalImages;
                imageList.push(ALL_IMAGES[index]);
            }
            
            return imageList;
        }

        // 图片轮播功能
        class Carousel {
            constructor(imageList) {
                this.currentSlide = 0;
                this.imageList = imageList;
                this.totalSlides = imageList.length;
                this.autoPlayInterval = null;
                this.slides = [];
                this.dots = [];
                this.imageSetIndex = 0; // 当前图片组的起始索引
                this.maxDisplayImages = 6; // 最多显示6个图片
                this.totalImages = ALL_IMAGES.length; // 总图片数量
                
                this.createCarouselStructure();
                this.init();
            }

            createCarouselStructure() {
                const carousel = document.getElementById('carousel');
                const carouselDots = document.getElementById('carouselDots');
                
                // 清空现有内容
                carousel.innerHTML = '';
                carouselDots.innerHTML = '';
                
                // 生成图片轮播结构
                this.imageList.forEach((imageKey, index) => {
                    // 创建图片滑块
                    const slide = document.createElement('div');
                    slide.className = `carousel-slide${index === 0 ? ' active' : ''}`;
                    
                    const img = document.createElement('img');
                    // 使用混淆的图片路径
                    const realImageName = IMAGE_MAP.get(imageKey);
                    if (realImageName) {
                        // 动态加载图片并添加防缓存参数
                        const timestamp = Date.now();
                        const randomParam = Math.random().toString(36).substring(7);
                        img.src = `images/${realImageName}?t=${timestamp}&r=${randomParam}`;
                        
                        // 添加图片加载保护
                        img.onload = function() {
                            // 图片加载完成后立即清除src属性中的真实路径信息
                            setTimeout(() => {
                                this.removeAttribute('data-original-src');
                            }, 100);
                        };
                    }
                    
                    img.alt = `美好回忆 ${index + 1}`;
                    img.onerror = function() {
                        console.warn(`图片加载失败`);
                        this.style.display = 'none';
                    };
                    
                    // 添加额外的图片属性混淆
                    img.setAttribute('data-protected', 'true');
                    img.setAttribute('data-key', imageKey);
                    
                    // 创建保护层
                    const protection = document.createElement('div');
                    protection.className = 'image-protection';
                    
                    slide.appendChild(img);
                    slide.appendChild(protection);
                    carousel.appendChild(slide);
                    
                    // 创建导航点
                    const dot = document.createElement('span');
                    dot.className = `dot${index === 0 ? ' active' : ''}`;
                    dot.setAttribute('data-slide', index);
                    carouselDots.appendChild(dot);
                });
                
                // 更新引用
                this.slides = document.querySelectorAll('.carousel-slide');
                this.dots = document.querySelectorAll('.dot');
            }

            init() {
                // 绑定导航点点击事件
                this.bindEvents();

                // 开始自动播放
                this.startAutoPlay();

                // 鼠标悬停时暂停自动播放
                const carouselContainer = document.querySelector('.carousel-container');
                carouselContainer.addEventListener('mouseenter', () => {
                    this.stopAutoPlay();
                });
                carouselContainer.addEventListener('mouseleave', () => {
                    this.startAutoPlay();
                });
            }

            goToSlide(slideIndex) {
                if (slideIndex < 0 || slideIndex >= this.totalSlides) return;
                
                // 移除当前活动状态
                this.slides[this.currentSlide].classList.remove('active');
                this.dots[this.currentSlide].classList.remove('active');

                // 设置新的活动状态
                this.currentSlide = slideIndex;
                this.slides[this.currentSlide].classList.add('active');
                this.dots[this.currentSlide].classList.add('active');
            }

            nextSlide() {
                const nextIndex = (this.currentSlide + 1) % this.totalSlides;
                
                // 只有在图片总数超过最大显示数量时才进行图片组切换
                if (nextIndex === 0 && this.totalImages > this.maxDisplayImages) {
                    this.switchToNextImageSet();
                } else {
                    this.goToSlide(nextIndex);
                }
            }

            // 切换到下一组图片
            switchToNextImageSet() {
                // 只有在图片总数超过最大显示数量时才执行切换
                if (this.totalImages <= this.maxDisplayImages) {
                    return;
                }
                
                this.imageSetIndex = (this.imageSetIndex + this.maxDisplayImages) % this.totalImages;
                this.imageList = getCurrentImageList(this.imageSetIndex);
                this.totalSlides = this.imageList.length;
                this.currentSlide = 0;
                
                console.log(`切换到图片组 ${Math.floor(this.imageSetIndex / this.maxDisplayImages) + 1}:`, this.imageList);
                
                // 重新创建轮播结构
                this.createCarouselStructure();
                
                // 重新绑定事件监听器
                this.bindEvents();
            }

            // 绑定事件监听器的独立方法
            bindEvents() {
                // 绑定导航点点击事件
                this.dots.forEach((dot, index) => {
                    dot.addEventListener('click', () => {
                        console.log(`点击导航点 ${index}`);
                        this.goToSlide(index);
                    });
                });
            }

            startAutoPlay() {
                this.autoPlayInterval = setInterval(() => {
                    this.nextSlide();
                }, 2000); // 每2秒切换一张图片
            }

            stopAutoPlay() {
                if (this.autoPlayInterval) {
                    clearInterval(this.autoPlayInterval);
                    this.autoPlayInterval = null;
                }
            }
        }

        // 飘浮心形动画
        function createFloatingHeart() {
            const heart = document.createElement('div');
            heart.className = 'floating-heart';
            
            // 随机位置和大小
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.bottom = '0';
            const size = 15 + Math.random() * 20;
            heart.style.width = size + 'px';
            heart.style.height = size + 'px';
            
            // 随机动画持续时间
            const duration = 5 + Math.random() * 3;
            heart.style.animationDuration = duration + 's';
            
            // 设置伪元素大小
            const style = document.createElement('style');
            const randomId = 'heart-' + Math.random().toString(36).substr(2, 9);
            heart.id = randomId;
            style.textContent = `
                #${randomId}:before, #${randomId}:after {
                    width: ${size}px;
                    height: ${size}px;
                }
                #${randomId}:before {
                    top: -${size/2}px;
                }
                #${randomId}:after {
                    left: ${size/2}px;
                }
            `;
            document.head.appendChild(style);
            
            document.body.appendChild(heart);
            
            // 清理元素
            setTimeout(() => {
                if (heart.parentNode) {
                    heart.remove();
                }
                if (style.parentNode) {
                    style.remove();
                }
            }, duration * 1000);
        }

        // 文字动画
        function animateText() {
            const lines = document.querySelectorAll('.romantic-text .line');
            lines.forEach((line, index) => {
                line.style.animation = `textFadeIn 1s ease-in-out forwards`;
                line.style.animationDelay = `${6 + index * 0.5}s`;
            });
        }

        // 开发者工具检测
        function detectDevTools() {
            let devtools = {
                open: false,
                orientation: null
            };
            
            const threshold = 160;
            
            setInterval(() => {
                if (window.outerHeight - window.innerHeight > threshold || 
                    window.outerWidth - window.innerWidth > threshold) {
                    if (!devtools.open) {
                        devtools.open = true;
                        // 检测到开发者工具打开时的处理
                        document.body.style.display = 'none';
                        alert('请关闭开发者工具后刷新页面');
                    }
                } else {
                    devtools.open = false;
                }
            }, 500);
            
            // 检测控制台
            let consoleCheck = () => {
                let start = new Date();
                debugger;
                let end = new Date();
                if (end - start > 100) {
                    document.body.style.display = 'none';
                    alert('请关闭开发者工具后刷新页面');
                }
            };
            
            setInterval(consoleCheck, 1000);
        }
        
        // 图片资源动态混淆
        function obfuscateImageSources() {
            setInterval(() => {
                const images = document.querySelectorAll('img[data-protected="true"]');
                images.forEach(img => {
                    if (img.src && img.src.includes('images/')) {
                        // 动态更改图片URL参数
                        const url = new URL(img.src);
                        url.searchParams.set('_', Math.random().toString(36).substring(7));
                        url.searchParams.set('ts', Date.now());
                        img.src = url.toString();
                    }
                });
            }, 3000);
        }
        
        // 图片保护功能
        function initImageProtection() {
            // 禁止右键菜单
            document.addEventListener('contextmenu', function(e) {
                e.preventDefault();
                return false;
            });

            // 禁止拖拽
            document.addEventListener('dragstart', function(e) {
                e.preventDefault();
                return false;
            });

            // 禁止选择
            document.addEventListener('selectstart', function(e) {
                e.preventDefault();
                return false;
            });

            // 禁止键盘快捷键
            document.addEventListener('keydown', function(e) {
                // 禁止 F12 (开发者工具)
                if (e.keyCode === 123) {
                    e.preventDefault();
                    return false;
                }
                
                // 禁止 Ctrl+S (保存)
                if (e.ctrlKey && e.keyCode === 83) {
                    e.preventDefault();
                    return false;
                }
                
                // 禁止 Ctrl+A (全选)
                if (e.ctrlKey && e.keyCode === 65) {
                    e.preventDefault();
                    return false;
                }
                
                // 禁止 Ctrl+U (查看源代码)
                if (e.ctrlKey && e.keyCode === 85) {
                    e.preventDefault();
                    return false;
                }
                
                // 禁止 Ctrl+Shift+I (开发者工具)
                if (e.ctrlKey && e.shiftKey && e.keyCode === 73) {
                    e.preventDefault();
                    return false;
                }
                
                // 禁止 Ctrl+Shift+J (控制台)
                if (e.ctrlKey && e.shiftKey && e.keyCode === 74) {
                    e.preventDefault();
                    return false;
                }
                
                // 禁止 Ctrl+Shift+C (元素选择器)
                if (e.ctrlKey && e.shiftKey && e.keyCode === 67) {
                    e.preventDefault();
                    return false;
                }
            });

            // 禁止打印
            window.addEventListener('beforeprint', function(e) {
                e.preventDefault();
                return false;
            });
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 初始化图片映射
            initImageMap();
            
            // 启用所有保护功能
            initImageProtection();
            detectDevTools();
            obfuscateImageSources();
            
            try {
                // 使用静态图片列表初始化轮播
                const imageList = getCurrentImageList();
                console.log('使用图片:', imageList);
                
                if (imageList.length > 0) {
                    new Carousel(imageList);
                } else {
                    console.warn('未找到任何图片文件');
                    // 显示提示信息
                    const carousel = document.getElementById('carousel');
                    carousel.innerHTML = '<div style="display: flex; align-items: center; justify-content: center; height: 100%; color: white; font-size: 1.2rem;">暂无图片</div>';
                }
            } catch (error) {
                console.error('初始化轮播时出错:', error);
            }
            
            // 开始文字动画
            animateText();
            
            // 开始飘浮心形动画
            setInterval(createFloatingHeart, 800);
        });
    </script>
</body>
</html>
