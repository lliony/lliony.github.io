<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心花绽放 · 美好时光</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "楷体", KaiTi, serif;
            background: linear-gradient(45deg, #ff6b6b, #ffc0cb, #ff9a9e);
            background-size: 400% 400%;
            animation: gradientShift 8s ease infinite;
            min-height: 100vh;
            overflow-x: hidden;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .main-container {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            position: relative;
            z-index: 2;
        }

        /* 头部标题区域 */
        .header {
            text-align: center;
            padding: 40px 20px;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .main-title {
            font-size: 3rem;
            margin-bottom: 10px;
            opacity: 0;
            animation: titleFadeIn 2s ease-in-out 0.5s forwards;
        }

        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
            opacity: 0;
            animation: titleFadeIn 2s ease-in-out 1s forwards;
        }

        @keyframes titleFadeIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 内容区域 */
        .content {
            flex: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            gap: 40px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        /* 图片轮播区域 */
        .carousel-container {
            flex: 1;
            max-width: 500px;
            position: relative;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            opacity: 0;
            animation: slideInLeft 1.5s ease-in-out 1.5s forwards;
        }

        .carousel {
            position: relative;
            width: 100%;
            height: 400px;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .carousel-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        .carousel-slide.active {
            opacity: 1;
        }

        .carousel-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 15px;
        }

        /* 导航点 */
        .carousel-dots {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .dot.active {
            background: white;
            transform: scale(1.2);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }

        .dot:hover {
            background: rgba(255, 255, 255, 0.8);
            transform: scale(1.1);
        }

        /* 心形动画区域 */
        .heart-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            opacity: 0;
            animation: slideInRight 1.5s ease-in-out 2s forwards;
        }

        .center-heart {
            background-color: #ff3366;
            display: inline-block;
            height: 120px;
            position: relative;
            transform: rotate(-45deg);
            width: 120px;
            animation: appear 3s ease-in-out 2.5s forwards, beat 1.5s ease-in-out infinite 5.5s;
            opacity: 0;
            filter: drop-shadow(0 0 20px rgba(255, 51, 102, 0.6));
        }

        .center-heart:before,
        .center-heart:after {
            content: "";
            background-color: #ff3366;
            border-radius: 50%;
            height: 120px;
            position: absolute;
            width: 120px;
        }

        .center-heart:before {
            top: -60px;
            left: 0;
        }

        .center-heart:after {
            left: 60px;
            top: 0;
        }

        .romantic-text {
            color: white;
            font-size: 1.8rem;
            text-align: center;
            line-height: 2;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            max-width: 300px;
        }

        .romantic-text .line {
            display: block;
            opacity: 0;
        }

        /* 飘浮的心形 */
        .floating-heart {
            background-color: rgba(255, 255, 255, 0.9);
            display: inline-block;
            height: 20px;
            position: absolute;
            transform: rotate(-45deg);
            width: 20px;
            box-shadow: 0 0 15px rgba(255, 192, 203, 0.8);
            animation: float 6s ease-in-out infinite;
            z-index: 1;
        }

        .floating-heart:before,
        .floating-heart:after {
            content: "";
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            height: 20px;
            position: absolute;
            width: 20px;
            box-shadow: 0 0 15px rgba(255, 192, 203, 0.8);
        }

        .floating-heart:before {
            top: -10px;
            left: 0;
        }

        .floating-heart:after {
            left: 10px;
            top: 0;
        }

        /* 动画定义 */
        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-100px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(100px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes appear {
            0% {
                transform: rotate(-45deg) scale(0.1);
                opacity: 0;
            }
            50% {
                transform: rotate(-45deg) scale(1.2);
                opacity: 0.7;
            }
            100% {
                transform: rotate(-45deg) scale(1);
                opacity: 1;
            }
        }

        @keyframes beat {
            0%, 100% {
                transform: rotate(-45deg) scale(1);
            }
            50% {
                transform: rotate(-45deg) scale(1.15);
            }
        }

        @keyframes float {
            0% {
                transform: translateY(0) rotate(-45deg) scale(1);
                opacity: 0.8;
            }
            100% {
                transform: translateY(-100vh) rotate(315deg) scale(0.3);
                opacity: 0;
            }
        }

        @keyframes textFadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .content {
                flex-direction: column;
                gap: 30px;
                padding: 20px 10px;
            }

            .carousel-container {
                max-width: 100%;
                width: 100%;
            }

            .carousel {
                height: 300px;
            }

            .main-title {
                font-size: 2rem;
            }

            .romantic-text {
                font-size: 1.4rem;
            }

            .center-heart {
                height: 80px;
                width: 80px;
            }

            .center-heart:before,
            .center-heart:after {
                height: 80px;
                width: 80px;
            }

            .center-heart:before {
                top: -40px;
            }

            .center-heart:after {
                left: 40px;
            }
        }

        @media (max-width: 480px) {
            .header {
                padding: 20px 10px;
            }

            .main-title {
                font-size: 1.5rem;
            }

            .subtitle {
                font-size: 1rem;
            }

            .carousel {
                height: 250px;
            }

            .romantic-text {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- 头部标题 -->
        <header class="header">
            <h1 class="main-title">心花绽放</h1>
            <p class="subtitle">记录美好时光，珍藏温馨回忆</p>
        </header>

        <!-- 主要内容区域 -->
        <main class="content">
            <!-- 图片轮播区域 -->
            <div class="carousel-container">
                <div class="carousel" id="carousel">
                    <div class="carousel-slide active">
                        <img src="images/R0004755.jpg" alt="美好回忆 1">
                    </div>
                    <div class="carousel-slide">
                        <img src="images/R0004755_01.JPG" alt="美好回忆 2">
                    </div>
                    <div class="carousel-slide">
                        <img src="images/R0004757.jpg" alt="美好回忆 3">
                    </div>
                    <div class="carousel-slide">
                        <img src="images/R0004757_01.JPG" alt="美好回忆 4">
                    </div>
                    <div class="carousel-slide">
                        <img src="images/R0004811.jpg" alt="美好回忆 5">
                    </div>
                    <div class="carousel-slide">
                        <img src="images/R0004811_01.JPG" alt="美好回忆 6">
                    </div>
                    <div class="carousel-slide">
                        <img src="images/R0004815.jpg" alt="美好回忆 7">
                    </div>
                    <div class="carousel-slide">
                        <img src="images/R0004815_01.JPG" alt="美好回忆 8">
                    </div>
                    <div class="carousel-slide">
                        <img src="images/R0004820.jpg" alt="美好回忆 9">
                    </div>
                    <div class="carousel-slide">
                        <img src="images/R0004820_01.JPG" alt="美好回忆 10">
                    </div>
                </div>
                
                <!-- 导航点 -->
                <div class="carousel-dots" id="carouselDots">
                    <span class="dot active" data-slide="0"></span>
                    <span class="dot" data-slide="1"></span>
                    <span class="dot" data-slide="2"></span>
                    <span class="dot" data-slide="3"></span>
                    <span class="dot" data-slide="4"></span>
                    <span class="dot" data-slide="5"></span>
                    <span class="dot" data-slide="6"></span>
                    <span class="dot" data-slide="7"></span>
                    <span class="dot" data-slide="8"></span>
                    <span class="dot" data-slide="9"></span>
                </div>
            </div>

            <!-- 心形动画区域 -->
            <div class="heart-section">
                <div class="center-heart"></div>
                <div class="romantic-text" id="romanticText">
                    <span class="line">时光荏苒如流水</span>
                    <span class="line">唯有真情永不变</span>
                    <span class="line">愿此心如花绽放</span>
                    <span class="line">伴君共度好时光</span>
                </div>
            </div>
        </main>
    </div>

    <script>
        // 图片轮播功能
        class Carousel {
            constructor() {
                this.currentSlide = 0;
                this.slides = document.querySelectorAll('.carousel-slide');
                this.dots = document.querySelectorAll('.dot');
                this.totalSlides = this.slides.length;
                this.autoPlayInterval = null;
                
                this.init();
            }

            init() {
                // 绑定导航点点击事件
                this.dots.forEach((dot, index) => {
                    dot.addEventListener('click', () => {
                        this.goToSlide(index);
                    });
                });

                // 开始自动播放
                this.startAutoPlay();

                // 鼠标悬停时暂停自动播放
                const carouselContainer = document.querySelector('.carousel-container');
                carouselContainer.addEventListener('mouseenter', () => {
                    this.stopAutoPlay();
                });
                carouselContainer.addEventListener('mouseleave', () => {
                    this.startAutoPlay();
                });
            }

            goToSlide(slideIndex) {
                // 移除当前活动状态
                this.slides[this.currentSlide].classList.remove('active');
                this.dots[this.currentSlide].classList.remove('active');

                // 设置新的活动状态
                this.currentSlide = slideIndex;
                this.slides[this.currentSlide].classList.add('active');
                this.dots[this.currentSlide].classList.add('active');
            }

            nextSlide() {
                const nextIndex = (this.currentSlide + 1) % this.totalSlides;
                this.goToSlide(nextIndex);
            }

            startAutoPlay() {
                this.autoPlayInterval = setInterval(() => {
                    this.nextSlide();
                }, 2000); // 每2秒切换一张图片
            }

            stopAutoPlay() {
                if (this.autoPlayInterval) {
                    clearInterval(this.autoPlayInterval);
                    this.autoPlayInterval = null;
                }
            }
        }

        // 飘浮心形动画
        function createFloatingHeart() {
            const heart = document.createElement('div');
            heart.className = 'floating-heart';
            
            // 随机位置和大小
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.bottom = '0';
            const size = 15 + Math.random() * 20;
            heart.style.width = size + 'px';
            heart.style.height = size + 'px';
            
            // 随机动画持续时间
            const duration = 5 + Math.random() * 3;
            heart.style.animationDuration = duration + 's';
            
            // 设置伪元素大小
            const style = document.createElement('style');
            const randomId = 'heart-' + Math.random().toString(36).substr(2, 9);
            heart.id = randomId;
            style.textContent = `
                #${randomId}:before, #${randomId}:after {
                    width: ${size}px;
                    height: ${size}px;
                }
                #${randomId}:before {
                    top: -${size/2}px;
                }
                #${randomId}:after {
                    left: ${size/2}px;
                }
            `;
            document.head.appendChild(style);
            
            document.body.appendChild(heart);
            
            // 清理元素
            setTimeout(() => {
                if (heart.parentNode) {
                    heart.remove();
                }
                if (style.parentNode) {
                    style.remove();
                }
            }, duration * 1000);
        }

        // 文字动画
        function animateText() {
            const lines = document.querySelectorAll('.romantic-text .line');
            lines.forEach((line, index) => {
                line.style.animation = `textFadeIn 1s ease-in-out forwards`;
                line.style.animationDelay = `${6 + index * 0.5}s`;
            });
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 初始化轮播
            new Carousel();
            
            // 开始文字动画
            animateText();
            
            // 开始飘浮心形动画
            setInterval(createFloatingHeart, 800);
        });
    </script>
</body>
</html>
