<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心花绽放</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(45deg, #ff6b6b, #ffc0cb);
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            z-index: 2;
        }

        .text {
            color: white;
            font-size: 24px;
            font-family: "楷体", KaiTi, serif;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            text-align: center;
            line-height: 1.8;
        }

        .text span {
            display: inline-block;
            opacity: 0;
        }

        @keyframes charFadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .center-heart {
            background-color: #ff3366;
            display: inline-block;
            height: 100px;
            position: relative;
            top: 0;
            transform: rotate(-45deg);
            width: 100px;
            animation: appear 3s ease-in-out forwards, beat 1s ease-in-out infinite 3s;
            opacity: 0;
            z-index: 2;
        }

        .center-heart:before,
        .center-heart:after {
            content: "";
            background-color: #ff3366;
            border-radius: 50%;
            height: 100px;
            position: absolute;
            width: 100px;
        }

        .center-heart:before {
            top: -50px;
            left: 0;
        }

        .center-heart:after {
            left: 50px;
            top: 0;
        }

        .floating-heart {
            background-color: white;
            display: inline-block;
            height: 20px;
            position: absolute;
            transform: rotate(-45deg);
            width: 20px;
            box-shadow: 0 0 10px rgba(255, 192, 203, 0.8);
            animation: float 4s ease-in-out infinite;
        }

        .floating-heart:before,
        .floating-heart:after {
            content: "";
            background-color: white;
            border-radius: 50%;
            height: 20px;
            position: absolute;
            width: 20px;
            box-shadow: 0 0 10px rgba(255, 192, 203, 0.8);
        }

        .floating-heart:before {
            top: -10px;
            left: 0;
        }

        .floating-heart:after {
            left: 10px;
            top: 0;
        }

        @keyframes appear {
            0% {
                transform: rotate(-45deg) scale(0.1);
                opacity: 0;
            }
            50% {
                transform: rotate(-45deg) scale(1.1);
                opacity: 0.5;
            }
            100% {
                transform: rotate(-45deg) scale(1);
                opacity: 1;
            }
        }

        @keyframes float {
            0% {
                transform: translateY(0) rotate(-45deg) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateY(-1000px) rotate(315deg) scale(0);
                opacity: 0;
            }
        }

        @keyframes beat {
            0%, 100% {
                transform: rotate(-45deg) scale(1);
            }
            50% {
                transform: rotate(-45deg) scale(1.1);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="center-heart"></div>
        <div class="text"></div>
    </div>

    <script>
        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'floating-heart';
            
            // 随机位置和大小
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.bottom = '0';
            const size = 15 + Math.random() * 15;
            heart.style.width = size + 'px';
            heart.style.height = size + 'px';
            
            // 设置伪元素大小
            const style = document.createElement('style');
            const randomId = 'heart-' + Math.random().toString(36).substr(2, 9);
            heart.id = randomId;
            style.textContent = `
                #${randomId}:before, #${randomId}:after {
                    width: ${size}px;
                    height: ${size}px;
                }
                #${randomId}:before {
                    top: -${size/2}px;
                }
                #${randomId}:after {
                    left: ${size/2}px;
                }
            `;
            document.head.appendChild(style);
            
            document.body.appendChild(heart);
            
            setTimeout(() => {
                heart.remove();
                style.remove();
            }, 4000);
        }

        // 文字动画
        const text = "从此烟雨落金城\n一人撑伞两人行";
        const textContainer = document.querySelector('.text');
        
        function showText() {
            const lines = text.split('\n');
            lines.forEach((line, lineIndex) => {
                const lineDiv = document.createElement('div');
                line.split('').forEach((char, charIndex) => {
                    const span = document.createElement('span');
                    span.textContent = char;
                    span.style.animation = `charFadeIn 1s ease-in-out forwards`;
                    span.style.animationDelay = `${3 + (lineIndex * line.length + charIndex) * 0.2}s`;
                    lineDiv.appendChild(span);
                });
                textContainer.appendChild(lineDiv);
            });
        }

        // 移除心跳动画监听器，直接在初始动画中包含心跳
        // const centerHeart = document.querySelector('.center-heart');
        // centerHeart.addEventListener('animationend', () => {
        //     centerHeart.style.animation = 'beat 1s ease-in-out infinite';
        // });

        showText();
        setInterval(createHeart, 200);
    </script>
</body>
</html>
